name: OpticLink
options:
  bundleIdPrefix: com.opticlink
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.opticlink.camera
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    INFOPLIST_KEY_CFBundleDisplayName: "OpticLink"
    INFOPLIST_KEY_NSCameraUsageDescription: "OpticLink necesita acceso a la camara para transmitir video en alta definicion a tu computadora Linux con control manual total."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "OpticLink necesita acceso al microfono para transmitir audio a tu computadora."
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpticLink se conecta con tu computadora a traves de la red local o cable USB para transmitir video y recibir comandos de control de la camara."

targets:
  OpticLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OpticLink
        excludes:
          - "Info.plist"
    info:
      path: OpticLink/Info.plist
      properties:
        CFBundleDisplayName: "OpticLink"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "OpticLink necesita acceso a la cámara para transmitir video en alta definición a tu computadora Linux con control manual total."
        NSMicrophoneUsageDescription: "OpticLink necesita acceso al micrófono para transmitir audio a tu computadora."
        NSLocalNetworkUsageDescription: "OpticLink se conecta con tu computadora a través de la red local o cable USB para transmitir video y recibir comandos de control de la cámara."
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  OpticLink:
    shared: true
    build:
      targets:
        OpticLink: all
