name: OpticLink
options:
  bundleIdPrefix: com.opticlink
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1" # iPhone

targets:
  OpticLink:
    type: application
    platform: iOS
    sources:
      - path: OpticLink
        excludes:
          - "Info.plist"
    info:
      path: OpticLink/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.opticlink.camera
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO

schemes:
  OpticLink:
    shared: true
    build:
      targets:
        OpticLink: all
