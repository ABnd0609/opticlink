name: OpticLink
options:
  bundleIdPrefix: com.opticlink
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1" # iPhone

targets:
  OpticLink:
    type: application
    platform: iOS
    sources:
      - path: OpticLink
    info:
      path: OpticLink/Info.plist
      properties:
        CFBundleDisplayName: "OpticLink"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "OpticLink necesita acceso a la cámara para transmitir video en alta definición a tu computadora Linux con control manual total."
        NSMicrophoneUsageDescription: "OpticLink necesita acceso al micrófono para transmitir audio a tu computadora."
        NSLocalNetworkUsageDescription: "OpticLink se conecta con tu computadora a través de la red local o cable USB para transmitir video y recibir comandos de control."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.opticlink.camera
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
