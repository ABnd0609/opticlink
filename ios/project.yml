name: OpticLink
options:
  bundleIdPrefix: com.opticlink
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.opticlink.camera
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  OpticLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OpticLink
        excludes:
          - "Info.plist"
    info:
      path: OpticLink/Info.plist

schemes:
  OpticLink:
    shared: true
    build:
      targets:
        OpticLink: all
