name: Build OpticLink iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar IPA para iOS (macOS Cloud)
    runs-on: macos-15

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Preparar Entorno Xcode
        run: |
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto Xcode
        working-directory: ios
        run: |
          xcodegen generate

      - name: Compilar Proyecto para iPhone
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project OpticLink.xcodeproj \
            -scheme OpticLink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || {
              echo "==== DETALLE DEL ERROR DE COMPILACIÓN ===="
              tail -n 120 xcodebuild.log
              exit 1
            }

      - name: Empaquetar Archivo .IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build -name "OpticLink.app" -type d | head -n 1)
          echo "App encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Verificar e inyectar permisos de privacidad críticos en Info.plist para evitar SIGABRT al abrir
          python3 -c "
          import plistlib, os
          plist_path = 'Payload/OpticLink.app/Info.plist'
          if os.path.exists(plist_path):
              with open(plist_path, 'rb') as f:
                  p = plistlib.load(f)
              p['NSCameraUsageDescription'] = 'OpticLink necesita acceso a la cámara para transmitir video en alta definición a tu computadora Linux con control manual total.'
              p['NSMicrophoneUsageDescription'] = 'OpticLink necesita acceso al micrófono para transmitir audio a tu computadora.'
              p['NSLocalNetworkUsageDescription'] = 'OpticLink se conecta con tu computadora a través de la red local o cable USB para transmitir video y recibir comandos de control de la cámara.'
              p['CFBundleDisplayName'] = 'OpticLink'
              if 'UIBackgroundModes' not in p:
                  p['UIBackgroundModes'] = ['audio']
              with open(plist_path, 'wb') as f:
                  plistlib.dump(p, f)
              print('Info.plist verificado exitosamente con todas las descripciones de permisos requeridas por iOS.')
          "
          
          zip -r OpticLink.ipa Payload
          ls -la OpticLink.ipa

      - name: Subir Registro si Falla
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tail -n 150 ios/xcodebuild.log > ios/ULTIMO_ERROR_XCODE.txt
          git add ios/ULTIMO_ERROR_XCODE.txt
          git commit -m "Auto-report: detalle del error de xcodebuild [skip ci]" || true
          git push || true

      - name: Subir Artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpticLink-iOS-IPA
          path: ios/OpticLink.ipa
          retention-days: 14

      - name: Publicar Release con IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "OpticLink Pro v1.0.0"
          files: ios/OpticLink.ipa
          body: "Descarga directa de OpticLink.ipa para instalación en iOS."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
